<!DOCTYPE html>
<!-- FrameWorkers demo site — CREATION PROCESS canvas (read-only): every asset a run produced,
     laid out per agent step, with the inputs each step consumed drawn as connections.
     Data: process/<key>/graph.json (built by tools/export_process.py). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Inside a FrameWorkers production: every asset the Director's crew produced — inputs, story, keyframes, storyboards, shot prompts, clips, narration — and how they connect into the finished film." />
<meta name="robots" content="index, follow" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="FrameWorkers" />
<meta property="og:title" content="FrameWorkers — Creation process" />
<meta property="og:description" content="Inside a FrameWorkers production: every asset the Director's crew produced and how they connect into the finished film." />
<meta property="og:image" content="https://frameworkers.insait.ai/assets/og-cover.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<title>FrameWorkers — Creation process</title>
<link rel="stylesheet" href="assets/styles.css?v=86" />
<link rel="stylesheet" href="assets/process.css?v=3" />
<script src="assets/process.js?v=2" defer></script>
</head>
<body data-page="process" class="proc-body">

  <header class="proc-bar">
    <div class="proc-bar-l">
      <a class="proc-brand" href="index.html" aria-label="FrameWorkers home"><img src="assets/logo_wordmark_dark.png" alt="FrameWorkers" /></a>
      <span class="proc-sep"></span>
      <a class="proc-back" href="films.html">‹ Films</a>
      <span class="proc-sep"></span>
      <div class="proc-title-wrap">
        <div class="proc-eyebrow" id="pc-genre">Creation process</div>
        <h1 class="proc-title" id="pc-title">Loading…</h1>
      </div>
    </div>
    <div class="proc-bar-c">
      <div class="proc-legend" id="pc-legend">
        <span class="lg lg-image">image</span>
        <span class="lg lg-video">video</span>
        <span class="lg lg-audio">audio</span>
        <span class="lg lg-text">text</span>
        <span class="lg lg-json">json</span>
      </div>
    </div>
    <div class="proc-bar-r">
      <span class="proc-readonly">Read-only · produced by the Director's plan</span>
      <a class="btn btn-grad proc-play" id="pc-play" href="#">▶ Watch the film</a>
    </div>
  </header>

  <main class="proc-stage" id="stage" aria-label="Creation process canvas">
    <div class="proc-world" id="world">
      <svg class="proc-edges" id="edges" aria-hidden="true"></svg>
      <div class="proc-nodes" id="nodes"></div>
    </div>

    <div class="proc-hud">
      <button class="hud-btn" id="hud-edges" title="Show / hide connections" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M4 6h5a3 3 0 0 1 3 3v6a3 3 0 0 0 3 3h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4" cy="6" r="2" fill="currentColor"/><circle cx="20" cy="18" r="2" fill="currentColor"/></svg>
        <span>Connections</span>
      </button>
      <span class="hud-sep"></span>
      <button class="hud-btn hud-icon" id="hud-minus" title="Zoom out" aria-label="Zoom out">−</button>
      <span class="hud-zoom" id="hud-zoom">100%</span>
      <button class="hud-btn hud-icon" id="hud-plus" title="Zoom in" aria-label="Zoom in">+</button>
      <button class="hud-btn" id="hud-fit" title="Fit to screen">Fit</button>
    </div>

    <div class="proc-tip" id="tip">
      <span>Drag to pan · scroll to zoom · click any asset to open it</span>
      <button class="tip-x" id="tip-x" aria-label="Dismiss">×</button>
    </div>

    <aside class="proc-notes" id="pc-notes"></aside>
  </main>

  <!-- asset lightbox -->
  <div class="proc-modal" id="modal" aria-hidden="true">
    <div class="modal-card">
      <button class="modal-x" id="modal-x" aria-label="Close">×</button>
      <div class="modal-media" id="modal-media"></div>
      <div class="modal-meta">
        <div class="mm-stage" id="mm-stage"></div>
        <h2 class="mm-title" id="mm-title"></h2>
        <p class="mm-caption" id="mm-caption"></p>
        <dl class="mm-facts" id="mm-facts"></dl>
        <a class="mm-open" id="mm-open" href="#" target="_blank" rel="noopener">Open file ↗</a>
      </div>
    </div>
  </div>

</body>
</html>
